# ─────────────────────────────────────────────────────────────
# CV Shortlist Agent — LLM Provider Configuration
# Railway deployment: set PROVIDER=gemini and GEMINI_API_KEY env vars
# Local development: set PROVIDER=azure_foundry (uses az login)
# ─────────────────────────────────────────────────────────────

provider: gemini

# ── Google Gemini (default for Railway) ──────────────────────
gemini:
  api_key: ${GEMINI_API_KEY}
  model: gemini-2.5-flash-preview-04-17

# ── Azure AI Foundry (local dev, Grundfos Azure) ─────────────
azure_foundry:
  resource: ais-claude-resource
  model: claude-sonnet-4-6

# ── OpenAI ───────────────────────────────────────────────────
openai:
  api_key: ${OPENAI_API_KEY}
  model: gpt-4o

# ── Anthropic (direct) ───────────────────────────────────────
anthropic:
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-sonnet-4-6
